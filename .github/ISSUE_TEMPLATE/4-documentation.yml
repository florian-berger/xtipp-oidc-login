name: Documentation
description: Something is wrong, missing or unclear in the README or other documentation.
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - README
        - Page texts
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What is wrong or missing?
      description: For a difference between documentation and real behavior, show both.
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested text
      description: Optional, how it should read.
