name: Bug report
description: Something of the plugin does not work as expected (authentication, installation, ...).
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        > [!CAUTION]
        > **Never post your Client Secrets** of your OIDC configuration.
        > If you posted a one by accident, revoke and regenerate it immediately.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Where does the problem happen?
      options:
        - Authentication
        - Configuration
        - Installation / activation / migration
        - Removing the plugin
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe as detailed as possible what needs to be done to reproduce the issue
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect?
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: Relevant lines of `storage/logs/laravel.log` (remove personal data).
      render: shell

  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      description: See `version` in `plugin.json`.
      placeholder: "0.0.1"
    validations:
      required: true

  - type: input
    id: xtipp-version
    attributes:
      label: xTIPP version
      placeholder: "1.0.36"
    validations:
      required: true

  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "8.4"

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed every personal data from this report.
          required: true
        - label: I checked that all files of the plugin were uploaded and the plugin is activated.
          required: true
        - label: I searched the existing issues and this bug was not reported yet.
          required: true
